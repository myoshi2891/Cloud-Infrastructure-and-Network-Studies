   "url": "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html"
  },
  {
   "label": "DynamoDB TTL",
   "url": "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html"
  },
  {
   "label": "ElastiCache キャッシュ戦略",
   "url": "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html"
  },
  {
   "label": "S3 ライフサイクル",
   "url": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"
  },
  {
   "label": "OpenSearch Service",
   "url": "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html"
  }
 ]
};
const DIAGRAMS = {
d0: `flowchart LR
    A["Task 1 アプリ開発の基礎"] --> B["Task 2 Lambda"]
    B --> C["Task 3 データストア"]
    A --> A1["同期 非同期 疎結合"]
    A --> A2["SQS SNS Kinesis EventBridge"]
    B --> B1["設定 エラー処理 チューニング"]
    C --> C1["DynamoDB キー 一貫性 キャッシュ"]`,
d1: `flowchart TD
    S["Lambda をどう呼ぶか"] --> Q{"結果をすぐ返す必要があるか"}
    Q -->|"はい"| Y["同期 API Gateway ALB SDK Invoke"]
    Q -->|"いいえ"| N{"呼び出し元の種類"}
    N -->|"S3 SNS EventBridge"| AS["非同期 関数エラーは最大2回再試行"]
    N -->|"SQS Kinesis DynamoDB Streams"| ES["イベントソースマッピング ポーリング"]
    AS --> F["失敗は Destinations か DLQ へ"]
    ES --> F2["SQS はキュー側 DLQ ストリームは OnFailure 送信先"]`,
d2: `flowchart TD
    R["DynamoDB でデータを読む"] --> K{"パーティションキーを指定できるか"}
    K -->|"はい"| QU["Query"]
    K -->|"いいえ"| I{"別のキーで検索したいか"}
    I -->|"はい"| GS["GSI を追加して Query"]
    I -->|"いいえ"| SC["Scan 全件読み取りなので最終手段"]
    QU --> C{"最新値が必須か"}
    C -->|"はい"| SCR["ConsistentRead true"]
    C -->|"いいえ"| EC["結果整合性 既定で低コスト"]`
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js"></script>
<script>
const R = h => `<span class="rich">${h}</span>`;
const fig = (id, cap) => `<figure class="my-8 border-y border-[#d9dde4] bg-white"><div class="mono px-4 pt-3 text-base tracking-wide text-[#6a7280]">FIG. ${cap}</div><div class="dg" id="dg-${id}">図を描画中…</div></figure>`;
const ids = D.tasks.flatMap(t => t.skills.map(s => s.id));
const st = { done: new Set(), q: '', tab: 'all' };
const strip = h => h.replace(/<[^>]+>/g, '').toLowerCase();

/* ---- 静的な骨組み(一度だけ描画。図はここに置くので再描画で消えない) ---- */
document.getElementById('overview').innerHTML = `
  <div class="mono text-base tracking-widest text-[#6a7280]">AWS CERTIFIED DEVELOPER - ASSOCIATE</div>
  <div class="mt-4 flex flex-wrap items-end gap-x-8 gap-y-2">
    <div class="mono text-[5.5rem] font-semibold leading-none text-[#d4400f] sm:text-[8rem]">32<span class="text-[3rem] sm:text-[4.5rem]">%</span></div>
    <h1 class="max-w-xl pb-2 text-2xl font-bold leading-snug sm:text-3xl">Development with AWS Services<br><span class="text-xl font-medium text-[#5b6270]">全 29 スキルを初学者向けに整理</span></h1>
  </div>
  <dl class="mt-10 grid max-w-4xl border-t border-[#14161a] sm:grid-cols-2">
    ${D.overview.map(([k, v]) => `<div class="border-b border-[#e1e5ea] py-3 sm:pr-8"><dt class="text-base font-bold text-[#6a7280]">${k}</dt><dd class="mt-0.5">${R(v)}</dd></div>`).join('')}
  </dl>
  <p class="mt-6 max-w-3xl text-[#3d4452]">問われるのは「設計」より「サービスを選んで正しく実装・設定できるか」です。数値は更新されることがあるため、受験前に公式のクォータページで再確認してください。</p>
  ${fig('d0', '1 — Domain 1 の構成')}`;

const nav = [['overview', '試験の全体像'], ...D.tasks.map(t => [t.key, t.title.split(':')[0]]), ['traps', '比較表'], ['refs', '参考 URL']];
document.getElementById('aside').innerHTML = `
  <div class="sticky top-0 flex h-screen flex-col overflow-y-auto p-6">
    <div class="mono text-base font-semibold tracking-widest text-[#d4400f]">DVA-C02</div>
    <div class="mt-1 text-lg font-bold leading-snug">Domain 1<br>Development with AWS Services</div>
    <div class="mt-6"><div class="flex items-end justify-between"><span class="text-base text-[#6a7280]">学習済み</span>
      <span class="mono text-2xl font-semibold"><span class="cnt">0</span><span class="text-base text-[#6a7280]"> / ${ids.length}</span></span></div>
      <div class="mt-2 h-1.5 bg-[#e8ebf0]"><div class="bar h-full bg-[#d4400f] transition-all" style="width:0%"></div></div></div>
    <nav class="mt-8 space-y-1">${nav.map(([k, l]) => `<a data-nav="${k}" href="#${k}" class="block border-l-2 border-transparent py-1.5 pl-3 text-[#5b6270] hover:text-[#14161a]">${l}</a>`).join('')}</nav>
  </div>`;
document.getElementById('topbar').innerHTML = `<span class="mono text-base font-semibold text-[#d4400f]">DVA-C02</span><div class="h-1.5 flex-1 bg-[#e8ebf0]"><div class="bar h-full bg-[#d4400f]" style="width:0%"></div></div><span class="mono text-base"><span class="cnt">0</span>/${ids.length}</span>`;

document.getElementById('controls').innerHTML = `
  <div class="flex border border-[#14161a]">${[['all', 'すべて'], ...D.tasks.map(t => [t.key, 'Task ' + t.key.slice(-1)])]
    .map(([k, l]) => `<button data-tab="${k}" class="px-4 py-1.5">${l}</button>`).join('')}</div>
  <input id="q" placeholder="キーワードで絞り込み(例: SQS, 冪等)" class="min-w-[14rem] flex-1 border border-[#c9cfd8] bg-white px-3 py-1.5 outline-none focus:border-[#d4400f] sm:max-w-sm">`;

document.getElementById('body').innerHTML =
  D.tasks.map(t => `<section id="${t.key}" data-spy="${t.key}" data-task="${t.key}" class="pt-12">
    <h2 class="text-2xl font-bold"><span class="mono mr-3 text-[#d4400f]">T${t.key.slice(-1)}</span>${t.title.replace(/^Task \d:\s*/, '')}</h2>
    <div class="list mt-4 border-t-2 border-[#14161a]"></div>
    ${t.note ? `<p class="mt-5 border-l-4 border-[#e8a317] bg-[#fff8e6] px-4 py-3">${R(t.note)}</p>` : ''}
    ${t.key === 'task1' ? fig('d1', '2 — Lambda の呼び出しタイプ') : ''}${t.key === 'task3' ? fig('d2', '3 — DynamoDB の読み取り方法') : ''}
  </section>`).join('') + `
  <section id="traps" data-spy="traps" class="pt-14"><h2 class="text-2xl font-bold">試験直前: 頻出の比較</h2>
    <div class="mt-4 border-t-2 border-[#14161a]">${D.traps.map(([a, b]) => `<div class="grid gap-x-8 gap-y-1 border-b border-[#dfe3e9] py-4 md:grid-cols-[16rem_1fr]"><div class="font-bold">${R(a)}</div><div class="text-[#2b3140]">${R(b)}</div></div>`).join('')}</div></section>
  <section id="refs" data-spy="refs" class="pt-14"><h2 class="text-2xl font-bold">根拠となる公式ソース</h2>
    <ol class="mt-4 border-t-2 border-[#14161a]">${D.refs.map((r, i) => `<li class="grid grid-cols-[2.5rem_1fr] gap-x-2 border-b border-[#dfe3e9] py-2.5"><span class="mono text-[#6a7280]">${String(i + 1).padStart(2, '0')}</span><div class="min-w-0"><div class="font-medium">${r.label}</div><a href="${r.url}" target="_blank" rel="noreferrer" class="mono break-all text-[#1d4ed8] underline-offset-2 hover:underline">${r.url}</a></div></li>`).join('')}</ol></section>
  <p class="mt-14 text-base text-[#6a7280]">情報は公式ドキュメントを根拠にしていますが、受験前に最新情報を必ず確認してください。</p>`;

/* ---- 状態で変わる部分だけを再描画 ---- */
function render() {
  const q = st.q.toLowerCase();
  D.tasks.forEach(t => {
    const sec = document.getElementById(t.key);
    sec.style.display = (st.tab === 'all' || st.tab === t.key) ? '' : 'none';
    const list = t.skills.filter(s => !q || strip(s.id + s.name + s.point + s.bp).includes(q));
    sec.querySelector('.list').innerHTML = list.length ? list.map(s => `
      <article class="grid gap-x-8 gap-y-3 border-b border-[#dfe3e9] py-6 md:grid-cols-[7.5rem_1fr_1fr] ${st.done.has(s.id) ? 'opacity-55' : ''}">
        <div><div class="mono text-lg font-semibold text-[#d4400f]">${s.id}</div>
          <label class="mt-2 flex cursor-pointer items-center gap-2 text-[#5b6270]"><input type="checkbox" data-done="${s.id}" ${st.done.has(s.id) ? 'checked' : ''} class="h-4 w-4 accent-[#d4400f]">学習済み</label></div>
        <div><h3 class="text-lg font-bold leading-snug">${s.name}</h3><div class="mono mt-3 text-base tracking-wide text-[#6a7280]">要点</div><p class="mt-0.5">${R(s.point)}</p></div>
        <div class="border-l-2 border-[#d4400f] bg-white py-3 pl-4 pr-3"><div class="mono text-base tracking-wide text-[#a8310a]">BEST PRACTICE / 試験の罠</div><p class="mt-1">${R(s.bp)}</p></div>
      </article>`).join('') : '<p class="py-6 text-[#6a7280]">該当するスキルがありません。</p>';
  });
  document.querySelectorAll('[data-tab]').forEach(b => { const on = b.dataset.tab === st.tab; b.className = 'px-4 py-1.5 ' + (on ? 'bg-[#14161a] text-white' : 'bg-white hover:bg-[#eef0f3]'); });
  const n = st.done.size;
  document.querySelectorAll('.cnt').forEach(e => e.textContent = n);
  document.querySelectorAll('.bar').forEach(e => e.style.width = Math.round(n / ids.length * 100) + '%');
}
/* 再描画でチェックボックスが置き換わるため、同じスキルの新しい要素へフォーカスを戻す */
document.addEventListener('change', e => { const id = e.target.dataset.done; if (id) { e.target.checked ? st.done.add(id) : st.done.delete(id); render(); document.querySelector(`[data-done="${id}"]`)?.focus({ preventScroll: true }); } });
/* タスク絞り込みで非表示のセクションへ移動する場合は、先にそのタスクのタブを有効化する */
function reveal(key) {
  if (!D.tasks.some(t => t.key === key) || st.tab === 'all' || st.tab === key) return;
  st.tab = key; render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (b) { st.tab = b.dataset.tab; render(); return; }
  const a = e.target.closest('a[href^="#"]'); if (a) reveal(a.getAttribute('href').slice(1));
});
addEventListener('hashchange', () => { const key = location.hash.slice(1); reveal(key); document.getElementById(key)?.scrollIntoView(); });
document.getElementById('q').addEventListener('input', e => { st.q = e.target.value; render(); });

/* ---- 現在地ハイライト ---- */
function spy() {
  let cur = 'overview';
  document.querySelectorAll('[data-spy]').forEach(e => { if (e.offsetParent !== null && e.getBoundingClientRect().top <= innerHeight * .3) cur = e.dataset.spy; });
  document.querySelectorAll('[data-nav]').forEach(a => { const on = a.dataset.nav === cur; a.classList.toggle('border-[#d4400f]', on); a.classList.toggle('font-bold', on); a.classList.toggle('text-[#14161a]', on); });
}
addEventListener('scroll', spy, { passive: true });

/* ---- Mermaid(CDN から取得した v11.12.0 でクライアント描画) ---- */
async function drawDiagrams() {
  mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'loose',
    flowchart: { useMaxWidth: false, htmlLabels: true, padding: 16 },
    themeVariables: { fontSize: '16px', fontFamily: '"IBM Plex Sans JP","Hiragino Sans",sans-serif', primaryColor: '#ffffff', primaryTextColor: '#14161a', primaryBorderColor: '#14161a', lineColor: '#5b6270', secondaryColor: '#fff1e8', tertiaryColor: '#f6f7f9' } });
  await document.fonts.ready;
  for (const [id, src] of Object.entries(DIAGRAMS)) {
    const host = document.getElementById('dg-' + id);
    try {
      const { svg } = await mermaid.render('m-' + id, src);
      host.innerHTML = svg;
      const s = host.querySelector('svg');
      const [x, y, w, h] = s.getAttribute('viewBox').split(/\s+/).map(Number);
      s.setAttribute('viewBox', `${x} ${y} ${w} ${h + 15}`);
      s.removeAttribute('width'); s.removeAttribute('height');
      Object.assign(s.style, { width: w + 'px', height: 'auto', maxWidth: 'none', flexShrink: '0', overflow: 'visible' });
    } catch (err) { host.textContent = '図の描画に失敗しました: ' + err.message; }
  }
}
render(); spy(); drawDiagrams();
</script>
</body>
</html>
